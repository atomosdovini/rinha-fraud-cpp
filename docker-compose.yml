services:
  # Load balancer obrigatório (ARQUITETURA.md): recebe na :9999 e distribui
  # as conexões round-robin para api1/api2 passando o fd via SCM_RIGHTS sobre
  # Unix sockets — sem inspecionar payload, sem lógica de negócio.
  #
  # NOTA: cpuset (pinning de CPU) foi testado e PIOROU muito (1.00 -> 1.43ms,
  # 25º lugar) — provável que CPU0/CPU1 sejam HT siblings do mesmo core físico.
  # Não usar cpuset.
  lb:
    image: ghcr.io/atomosdovini/rinha-fraud-cpp:latest
    entrypoint: ["/lb"]
    ports:
      - "9999:9999"
    environment:
      - PORT=9999
      - WORKERS=2
      - UPSTREAMS=/sockets/api1.sock,/sockets/api2.sock
    volumes:
      - sockets:/sockets
    depends_on:
      - api1
      - api2
    security_opt:
      - seccomp:unconfined
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "20M"

  api1:
    image: ghcr.io/atomosdovini/rinha-fraud-cpp:latest
    environment:
      - LISTEN=/sockets/api1.sock
      - INDEX_PATH=/index/index.bin
      - INDEX_MMAP=1
      - MALLOC_ARENA_MAX=1
      - PM_QOS=10
      - WORKER_RT=10
      - WORKERS=1
    volumes:
      - sockets:/sockets
    security_opt:
      - seccomp:unconfined
    devices:
      # PM QoS: server escreve PM_QOS µs aqui p/ limitar C-states (C1/C1E, sem C6).
      - /dev/cpu_dma_latency
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      # rtprio: permite SCHED_FIFO sem capability (RLIMIT_RTPRIO).
      rtprio: 99
      memlock: -1
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "165M"

  api2:
    image: ghcr.io/atomosdovini/rinha-fraud-cpp:latest
    environment:
      - LISTEN=/sockets/api2.sock
      - INDEX_PATH=/index/index.bin
      - INDEX_MMAP=1
      - MALLOC_ARENA_MAX=1
      - PM_QOS=10
      - WORKER_RT=10
      - WORKERS=1
    volumes:
      - sockets:/sockets
    security_opt:
      - seccomp:unconfined
    devices:
      # PM QoS: server escreve PM_QOS µs aqui p/ limitar C-states (C1/C1E, sem C6).
      - /dev/cpu_dma_latency
    logging:
      driver: "none"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      # rtprio: permite SCHED_FIFO sem capability (RLIMIT_RTPRIO).
      rtprio: 99
      memlock: -1
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "165M"

volumes:
  sockets:
