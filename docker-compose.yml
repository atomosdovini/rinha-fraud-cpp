services:
  # Sem load balancer: api1 e api2 fazem bind direto em :9999 com SO_REUSEPORT.
  # O kernel distribui as conexões entre os dois sockets — zero hop em userspace,
  # zero fd-passing. api2 compartilha o network namespace de api1.
  api1:
    build:
      context: .
      dockerfile: Dockerfile
    image: rinha_fraud_cpp:dev
    ports:
      - "9999:9999"
    environment:
      - TCP_PORT=9999
      - INDEX_PATH=/index/index.bin
      - NPROBE=20
      - FAST_NPROBE=1
      - ADAPTIVE_MIN=2
      - ADAPTIVE_MAX=4
      - EXTREME0_WORST_THRESHOLD=3501932
      - EXTREME1_WORST_THRESHOLD=3569273
      - EXTREME5_WORST_THRESHOLD=4594089
      - REPAIR_MIN=99
      - REPAIR_MAX=0
      - INDEX_MMAP=1
      - MALLOC_ARENA_MAX=1
      - BUSY_POLL=128
      - PM_QOS=10
      - WORKERS=1
    security_opt:
      - seccomp:unconfined
    devices:
      # PM QoS: server escreve PM_QOS µs aqui p/ limitar C-states (C1/C1E, sem C6).
      - /dev/cpu_dma_latency
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "175M"

  api2:
    image: rinha_fraud_cpp:dev
    network_mode: "service:api1"
    environment:
      - TCP_PORT=9999
      - INDEX_PATH=/index/index.bin
      - NPROBE=20
      - FAST_NPROBE=1
      - ADAPTIVE_MIN=2
      - ADAPTIVE_MAX=4
      - EXTREME0_WORST_THRESHOLD=3501932
      - EXTREME1_WORST_THRESHOLD=3569273
      - EXTREME5_WORST_THRESHOLD=4594089
      - REPAIR_MIN=99
      - REPAIR_MAX=0
      - INDEX_MMAP=1
      - MALLOC_ARENA_MAX=1
      - BUSY_POLL=128
      - PM_QOS=10
      - WORKERS=1
    depends_on:
      - api1
    security_opt:
      - seccomp:unconfined
    devices:
      # PM QoS: server escreve PM_QOS µs aqui p/ limitar C-states (C1/C1E, sem C6).
      - /dev/cpu_dma_latency
    logging:
      driver: "none"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "175M"
