services:
  # Load balancer obrigatório (ARQUITETURA.md): recebe na :9999 e distribui
  # as conexões round-robin para api1/api2 passando o fd via SCM_RIGHTS sobre
  # Unix sockets — sem inspecionar payload, sem lógica de negócio.
  #
  # Restrições da Engine (rejeitam a submissão): proibido `cap_add`,
  # `security_opt`, `devices`, `privileged`, `cpuset`. Permitido: `ulimits`.
  lb:
    image: ghcr.io/atomosdovini/rinha-fraud-cpp:latest
    restart: always
    entrypoint: ["/lb"]
    ports:
      - "9999:9999"
    environment:
      - PORT=9999
      - WORKERS=2
      - UPSTREAMS=/sockets/api1.sock,/sockets/api2.sock
    volumes:
      - sockets:/sockets
    depends_on:
      - api1
      - api2
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "20M"

  api1:
    image: ghcr.io/atomosdovini/rinha-fraud-cpp:latest
    restart: always
    environment:
      - LISTEN=/sockets/api1.sock
      - INDEX_PATH=/index/index.bin
      - INDEX_MMAP=1
      - MALLOC_ARENA_MAX=1
      - WORKERS=1
      # Re-run gating: thresholds ~12% acima dos defaults compilados
      # (3501932/3569273/4594089). Hipotese: re-run do IVF e o termo dominante
      # do p99 (CLAUDE.md); subir threshold = re-run dispara menos.
      # OBRIGATORIO validar 0 FP/FN com k6 local antes de gastar previa.
      - EXTREME0_WORST_THRESHOLD=3922164
      - EXTREME1_WORST_THRESHOLD=3997585
      - EXTREME5_WORST_THRESHOLD=5145380
    volumes:
      - sockets:/sockets
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock: -1
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "165M"

  api2:
    image: ghcr.io/atomosdovini/rinha-fraud-cpp:latest
    restart: always
    environment:
      - LISTEN=/sockets/api2.sock
      - INDEX_PATH=/index/index.bin
      - INDEX_MMAP=1
      - MALLOC_ARENA_MAX=1
      - WORKERS=1
      - EXTREME0_WORST_THRESHOLD=3922164
      - EXTREME1_WORST_THRESHOLD=3997585
      - EXTREME5_WORST_THRESHOLD=5145380
    volumes:
      - sockets:/sockets
    logging:
      driver: "none"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock: -1
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "165M"

volumes:
  sockets:
