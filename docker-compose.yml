services:
  # Load balancer obrigatório (ARQUITETURA.md): recebe na :9999 e distribui
  # as conexões round-robin para api1/api2 passando o fd via SCM_RIGHTS sobre
  # Unix sockets — sem inspecionar payload, sem lógica de negócio.
  #
  # Restrições da Engine (rejeitam a submissão): proibido `cap_add`,
  # `security_opt`, `devices`, `privileged`, `cpuset`. Permitido: `ulimits`.
  lb:
    image: ghcr.io/atomosdovini/rinha-fraud-cpp:latest
    restart: always
    entrypoint: ["/lb"]
    ports:
      - "9999:9999"
    environment:
      - PORT=9999
      - WORKERS=2
      - UPSTREAMS=/sockets/api1.sock,/sockets/api2.sock
    volumes:
      - sockets:/sockets
    depends_on:
      - api1
      - api2
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "20M"

  api1:
    image: ghcr.io/atomosdovini/rinha-fraud-cpp:latest
    restart: always
    environment:
      - LISTEN=/sockets/api1.sock
      - INDEX_PATH=/index/index.bin
      - INDEX_MMAP=1
      - MALLOC_ARENA_MAX=1
      - WORKERS=1
      # Limita probes do re-run IVF. cap=1 = nao probar nenhum cluster alem
      # do fast probe. Local k6: 0 FP/FN preservado (dataset igual ao da nuvem
      # -> recall deterministico). Hipotese: corta o termo dominante do p99.
      - RERUN_CAP=1
    volumes:
      - sockets:/sockets
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock: -1
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "165M"

  api2:
    image: ghcr.io/atomosdovini/rinha-fraud-cpp:latest
    restart: always
    environment:
      - LISTEN=/sockets/api2.sock
      - INDEX_PATH=/index/index.bin
      - INDEX_MMAP=1
      - MALLOC_ARENA_MAX=1
      - WORKERS=1
      - RERUN_CAP=1
    volumes:
      - sockets:/sockets
    logging:
      driver: "none"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock: -1
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "165M"

volumes:
  sockets:
